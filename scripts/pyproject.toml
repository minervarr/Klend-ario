[project]
name = "klend-ario-build"
version = "0.1.0"
description = "Build tooling for Klend-ario (stdlib-only runtime)"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
klend-ario-build = "klend_ario_build.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
